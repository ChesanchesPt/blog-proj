apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-ingress
  namespace: blog
spec:
  rules:
  - host: blog.local
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /posts
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /comments
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80